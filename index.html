<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>智能问答助手</title>
    <!-- Markdown 渲染：marked 负责排版，DOMPurify 负责防注入；加载失败时自动退回纯文本显示 -->
    <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, 'Segoe UI', Roboto;
            background: #f0f2f5;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .chat-container {
            width: 100%;
            max-width: 800px;
            height: 90vh;
            background: white;
            border-radius: 28px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .chat-header {
            background: #1e3a8a;
            color: white;
            padding: 18px;
            text-align: center;
            font-size: 1.3rem;
            font-weight: 600;
        }
        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: #f9fafb;
        }
        .message { display: flex; }
        .user { justify-content: flex-end; }
        .assistant { justify-content: flex-start; }
        .tool { justify-content: flex-start; }
        .bubble {
            max-width: 75%;
            padding: 10px 16px;
            border-radius: 20px;
            font-size: 0.95rem;
            line-height: 1.4;
            word-wrap: break-word;
        }
        .user .bubble {
            background: #1e3a8a;
            color: white;
            border-bottom-right-radius: 4px;
        }
        .assistant .bubble {
            background: white;
            color: #1f2937;
            border: 1px solid #e5e7eb;
            border-bottom-left-radius: 4px;
        }
        .tool .bubble {
            background: #f3f4f6;
            color: #6b7280;
            font-style: italic;
            font-size: 0.85rem;
            border: 1px solid #e5e7eb;
            border-bottom-left-radius: 4px;
        }
        .chat-input {
            padding: 16px;
            background: white;
            border-top: 1px solid #e5e7eb;
            display: flex;
            gap: 12px;
        }
        .chat-input input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #d1d5db;
            border-radius: 40px;
            font-size: 1rem;
            outline: none;
        }
        .chat-input input:focus {
            border-color: #1e3a8a;
            box-shadow: 0 0 0 2px rgba(30,58,138,0.2);
        }
        .chat-input button {
            background: #1e3a8a;
            color: white;
            border: none;
            padding: 0 24px;
            border-radius: 40px;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
        }
        .chat-input button:hover { background: #0f2b6d; }
        .typing { color: #6b7280; font-style: italic; }
        /* Markdown 渲染后的排版微调 */
        .md-body p { margin: 4px 0; }
        .md-body ul, .md-body ol { margin: 4px 0 4px 22px; }
        .md-body h1, .md-body h2, .md-body h3 { margin: 10px 0 4px; font-size: 1.02rem; }
        .md-body code { background: #f3f4f6; padding: 1px 5px; border-radius: 4px; font-size: 0.9em; }
        .md-body pre { background: #f3f4f6; padding: 8px; border-radius: 8px; overflow-x: auto; }
        .md-body table { border-collapse: collapse; margin: 6px 0; }
        .md-body td, .md-body th { border: 1px solid #e5e7eb; padding: 3px 8px; }
        .button-new {
            background: #6b7280;
            margin-left: 8px;
        }
        .flex-row {
            display: flex;
            gap: 8px;
        }
        /* 工具调用折叠面板 */
        .tool-trace {
            max-width: 75%;
            background: #f3f4f6;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 0;
            font-size: 0.85rem;
            color: #4b5563;
        }
        .tool-trace summary {
            padding: 8px 14px;
            cursor: pointer;
            font-weight: 500;
            color: #6b7280;
            list-style: none; /* 隐藏默认三角 */
            user-select: none;
        }
        .tool-trace summary::-webkit-details-marker { display: none; }
        .tool-trace summary::before {
            content: '▶ ';
            font-size: 0.75rem;
            transition: transform 0.15s;
            display: inline-block;
        }
        .tool-trace[open] summary::before {
            transform: rotate(90deg);
        }
        .tool-trace-body {
            padding: 0 14px 12px;
            border-top: 1px solid #e5e7eb;
        }
        .tool-block {
            padding: 8px 0;
            border-bottom: 1px dashed #e5e7eb;
        }
        .tool-block:last-child { border-bottom: none; }
        .tool-block .tool-name {
            font-weight: 600;
            color: #1f2937;
        }
        .tool-block .tool-label {
            color: #9ca3af;
            margin-right: 6px;
        }
        .tool-block pre {
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 6px;
            padding: 6px 10px;
            font-size: 0.8rem;
            max-height: 180px;
            overflow: auto;
            white-space: pre-wrap;
            word-break: break-all;
            margin: 4px 0 0 0;
        }
        .tool-block .result-summary {
            color: #6b7280;
            font-size: 0.82rem;
        }
    </style>
</head>
<body>
<div class="chat-container">
    <div class="chat-header">🍵 茶园智问 · 茶园管理助手</div>
    <div class="chat-messages" id="chatMessages">
        <div class="message assistant"><div class="bubble">你好！我是"茶园智问"。试试问我"茶饼病怎么防治"、"武夷山今天要防霜冻吗"，或点"📎 上传"把 PDF/Word 资料加入我的知识库，我就能回答里面的内容了。</div></div>
    </div>
    <div class="chat-input">
        <input type="text" id="messageInput" placeholder="输入你的问题..." autofocus>
        <div class="flex-row">
            <button id="sendBtn">发送</button>
            <button id="uploadBtn">📎 上传</button>
            <button id="newSessionBtn" class="button-new">新会话</button>
        </div>
        <input type="file" id="fileInput" accept=".pdf,.docx,.txt,.md" style="display:none">
    </div>
</div>

<script>
    let currentThreadId = localStorage.getItem("threadId");
    if (!currentThreadId) {
        currentThreadId = crypto.randomUUID ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => (Math.random()*16|0).toString(16));
        localStorage.setItem("threadId", currentThreadId);
    }

    const chatMessages = document.getElementById('chatMessages');
    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');
    const newSessionBtn = document.getElementById('newSessionBtn');

    function addMessage(role, text, isTool = false) {
        const div = document.createElement('div');
        if (isTool) {
            div.className = 'message tool';
        } else {
            div.className = `message ${role}`;
        }
        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        bubble.innerText = text;
        div.appendChild(bubble);
        chatMessages.appendChild(div);
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    // 将 Markdown 文本渲染为安全 HTML；marked/DOMPurify 未加载成功时退回纯文本
    function renderMarkdown(text) {
        if (window.marked && window.DOMPurify) {
            return DOMPurify.sanitize(marked.parse(text));
        }
        const d = document.createElement('div');
        d.innerText = text;
        return d.innerHTML;
    }

    // 尝试把字符串/对象格式化为美化 JSON；无法解析则原样返回
    function safeJson(obj) {
        if (obj == null) return '(空)';
        if (typeof obj === 'string') {
            try { return JSON.stringify(JSON.parse(obj), null, 2); }
            catch { return obj; }
        }
        try { return JSON.stringify(obj, null, 2); }
        catch { return String(obj); }
    }

    // 与 addMessage 类似，但按 Markdown 渲染（用于 Agent 最终回答）
    function addRichMessage(role, markdownText) {
        const div = document.createElement('div');
        div.className = `message ${role}`;
        const bubble = document.createElement('div');
        bubble.className = 'bubble md-body';
        bubble.innerHTML = renderMarkdown(markdownText);
        div.appendChild(bubble);
        chatMessages.appendChild(div);
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function showTyping() {
        const div = document.createElement('div');
        div.className = 'message assistant';
        div.id = 'typingIndicator';
        div.innerHTML = '<div class="bubble typing">正在思考...</div>';
        chatMessages.appendChild(div);
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function removeTyping() {
        const el = document.getElementById('typingIndicator');
        if (el) el.remove();
    }

    async function sendMessage() {
        const msg = messageInput.value.trim();
        if (!msg) return;
        addMessage('user', msg);
        messageInput.value = '';
        messageInput.focus();
        showTyping();
        try {
            const res = await fetch('http://127.0.0.1:5050/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: msg, thread_id: currentThreadId })
            });
            const data = await res.json();
            removeTyping();
            if (data.error) {
                addMessage('assistant', `错误: ${data.error}`);
            } else {
                // 显示工具调用信息：聚合为折叠面板（call+result 一一配对）
                if (data.tool_calls_info && data.tool_calls_info.length > 0) {
                    // 1) 按顺序配对 call + result
                    const tools = [];
                    let current = null;
                    for (let info of data.tool_calls_info) {
                        if (info.type === 'call') {
                            current = { tool: info.tool, args: info.args, result: null };
                            tools.push(current);
                        } else if (info.type === 'result' && current) {
                            current.result = info.content;
                            current = null;
                        }
                    }
                    if (tools.length > 0) {
                        // 2) 构建 <details> 折叠面板
                        const details = document.createElement('details');
                        details.className = 'tool-trace';
                        const toolNames = tools.map(t => t.tool).join('、');
                        details.innerHTML =
                            `<summary>🔧 调用了 ${tools.length} 个工具：${toolNames}</summary>` +
                            `<div class="tool-trace-body">` +
                            tools.map(t => {
                                const argsPretty = safeJson(t.args);
                                const resultPretty = safeJson(t.result);
                                const resultSummary = (t.result || '').length > 100
                                    ? t.result.substring(0, 100) + '...'
                                    : (t.result || '(无返回)');
                                return `
                                    <div class="tool-block">
                                        <span class="tool-name">${t.tool}</span>
                                        <div><span class="tool-label">参数</span><pre>${argsPretty}</pre></div>
                                        <div>
                                            <details>
                                                <summary class="result-summary">📦 返回：${resultSummary}</summary>
                                                <pre>${resultPretty}</pre>
                                            </details>
                                        </div>
                                    </div>`;
                            }).join('') +
                            `</div>`;
                        // 包装为灰色气泡容器
                        const wrap = document.createElement('div');
                        wrap.className = 'message tool';
                        wrap.appendChild(details);
                        chatMessages.appendChild(wrap);
                        chatMessages.scrollTop = chatMessages.scrollHeight;
                    }
                }
                // 显示最终回答（按 Markdown 渲染）
                addRichMessage('assistant', data.reply);
                // 更新 thread_id（一般不变）
                if (data.thread_id && data.thread_id !== currentThreadId) {
                    currentThreadId = data.thread_id;
                    localStorage.setItem("threadId", currentThreadId);
                }
            }
        } catch (err) {
            removeTyping();
            addMessage('assistant', '连接失败，请确认后端服务已启动 (python web_app.py)');
            console.error(err);
        }
    }

    sendBtn.addEventListener('click', sendMessage);
    messageInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });
    newSessionBtn.addEventListener('click', () => {
        currentThreadId = crypto.randomUUID();
        localStorage.setItem("threadId", currentThreadId);
        chatMessages.innerHTML = '';
        addMessage('assistant', '已开启新会话，之前的对话历史已清除。');
    });

    // 上传文档 → 入知识库
    const uploadBtn = document.getElementById('uploadBtn');
    const fileInput = document.getElementById('fileInput');
    uploadBtn.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', async () => {
        const file = fileInput.files[0];
        if (!file) return;
        addMessage('user', `📎 上传文件：${file.name}`);
        uploadBtn.disabled = true;
        uploadBtn.textContent = '入库中...';
        try {
            const fd = new FormData();
            fd.append('file', file);
            const res = await fetch('http://127.0.0.1:5050/upload', { method: 'POST', body: fd });
            const data = await res.json();
            if (data.error) {
                addMessage('assistant', `入库失败：${data.error}`);
            } else {
                addMessage('assistant', `✅《${data.filename}》已加入知识库（${data.chunks} 个知识块）。现在可以直接问我这份文档里的内容了。`);
            }
        } catch (err) {
            addMessage('assistant', '上传失败，请确认后端服务已启动 (python web_app.py)');
            console.error(err);
        } finally {
            uploadBtn.disabled = false;
            uploadBtn.textContent = '📎 上传';
            fileInput.value = '';
        }
    });
</script>
</body>
</html>
